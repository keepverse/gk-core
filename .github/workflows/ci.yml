name: CI

on:
  # Release calls this workflow as a required superset job. The same checked-in definition is the
  # only place the complete gate list lives; release does not infer coverage from a partial copy.
  workflow_call:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# VERIFICATION_GATE:native-tests
# VERIFICATION_GATE:content-generators
# VERIFICATION_GATE:python-tooling
# VERIFICATION_GATE:web-unit
# VERIFICATION_GATE:web-build
# VERIFICATION_GATE:web-e2e
# VERIFICATION_GATE:server
# VERIFICATION_GATE:importer
# VERIFICATION_GATE:guards
# VERIFICATION_GATE:generated-seed
# VERIFICATION_GATE:session-boundary
# VERIFICATION_GATE:packaging
jobs:
  test:
    runs-on: windows-latest
    # 2026-09-06: a real, reproduced .NET process-redirection deadlock (fixed the same day in
    # CreatureSpeciesImportCliTests.cs/RealColdProcessTests.cs) hung a local test run for 17+ minutes
    # with no diagnostic naming the stuck test. GitHub Actions' own default job timeout is 6 hours —
    # a future hang of this shape would silently burn most of a day's CI minutes before failing.
    # This bound is generous for the real runtime (normally well under it) and only exists to fail
    # fast with SOME signal rather than run to the platform default.
    timeout-minutes: 60
    # The generators and seedsmith resolve gk-core and the content pack through KeepverseRoots,
    # which walks UP looking for a directory holding gk-core/ NEXT TO gk-data/. This repository is
    # checked out into gk-core/ precisely so that walk can succeed - CreatureSpeciesGen's own usage
    # line says "found by walking" - and so that a step's `--project ../gk-forge/tools/X` resolves
    # to the sibling checkout. These two variables are the same answer by CONFIGURATION rather than
    # by layout: KeepverseRoots.Core() and .Content() return them BEFORE they walk
    # (KeepverseRoots.cs:79 and :93), so a step that needs a root gets it even if the walk is
    # disturbed. Paths are configuration (docs: every port and install path is), never a literal
    # that happens to hold on one machine.
    env:
      KEEPVERSE_CORE_ROOT: ${{ github.workspace }}/gk-core
      KEEPVERSE_CONTENT_ROOT: ${{ github.workspace }}/gk-data/packs/fusion
    defaults:
      run:
        # This repository is checked out into gk-core/ (see the first checkout step), so a step
        # that declares no working-directory of its own runs inside gk-core/ - the directory every
        # generator step's `--project ../gk-forge/tools/X` is written against. A step that DOES
        # declare one resolves against the workspace root, not against this default, so the sibling
        # steps below name gk-forge/, gk-web/ and gk-workflow/ in full.
        working-directory: gk-core
    steps:
      # This repository, checked out into gk-core/ rather than at the workspace root, so the
      # sibling checkouts below sit BESIDE it. That single fact is what makes the generator steps
      # work: each one names its project as `../gk-forge/tools/X`, which from gk-core/ resolves to
      # the gk-forge/ checkout, and which from the workspace root would resolve one level above the
      # runner's own directory and find nothing.
      - uses: actions/checkout@v4
        with:
          path: gk-core
          # Full history is required: a push may contain several commits, and the generated-seed
          # guard must inspect the complete event range rather than only the last commit.
          fetch-depth: 0

      # The split moved the generators, seedsmith, the web and the fail-closed helpers out of this
      # repository, but every gate stayed here - this file is deliberately the single complete gate
      # list, and release.yml calls it as a required superset job. So it is given sight of its
      # siblings rather than the gates being scattered into the repositories that own the code.
      - name: Checkout gk-forge (generators, seedsmith, validators)
        uses: actions/checkout@v4
        with:
          repository: keepverse/gk-forge
          path: gk-forge

      - name: Checkout gk-web (the web gates)
        uses: actions/checkout@v4
        with:
          repository: keepverse/gk-web
          path: gk-web

      - name: Checkout gk-workflow (the fail-closed regression helpers)
        uses: actions/checkout@v4
        with:
          repository: keepverse/gk-workflow
          path: gk-workflow

      # gk-data is PRIVATE and stays private. Every content gate below reads it, so an absent token
      # is a named refusal that throws BEFORE any gate runs - the job fails closed rather than
      # passing a subset of its declared coverage while reporting the whole list.
      - name: Refuse without the private-content token
        shell: pwsh
        env:
          TOKEN: ${{ secrets.KEEPVERSE_DATA_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TOKEN)) {
            throw ("gk-core CI needs secrets.KEEPVERSE_DATA_TOKEN to check out the private gk-data " +
                   "pack. The content gates read gk-data/packs/fusion/data/** - the generated-seed " +
                   "staleness guards, the item and creature validators, the corpus dump --verify and " +
                   "every seedsmith audit - and they walk up to find it next to gk-core. This gate " +
                   "fails closed rather than skipping them.")
          }

      - name: Checkout gk-data (private content pack)
        uses: actions/checkout@v4
        with:
          repository: keepverse/gk-data
          token: ${{ secrets.KEEPVERSE_DATA_TOKEN }}
          path: gk-data

      - name: Resolve complete verification range
        id: verification-range
        shell: pwsh
        run: |
          $event = Get-Content $env:GITHUB_EVENT_PATH -Raw | ConvertFrom-Json
          $head = if ($event.pull_request) { [string]$event.pull_request.head.sha } else { [string]$event.after }
          if ([string]::IsNullOrWhiteSpace($head) -or $head -match '^0+$') { $head = $env:GITHUB_SHA }
          if ([string]::IsNullOrWhiteSpace($head) -or $head -match '^0+$') { throw "CI cannot resolve the checked-out head SHA" }

          $base = if ($event.pull_request) { [string]$event.pull_request.base.sha } else { [string]$event.before }
          if ([string]::IsNullOrWhiteSpace($base) -or $base -match '^0+$') {
            $defaultBranch = [string]$event.repository.default_branch
            if ([string]::IsNullOrWhiteSpace($defaultBranch)) { $defaultBranch = 'main' }
            $base = (git merge-base $head "origin/$defaultBranch").Trim()
            if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($base)) {
              throw "CI cannot resolve an explicit verification base for $head"
            }
          }
          $range = "$base..$head"
          "range=$range" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "FUSIONRPG_VERIFICATION_RANGE=$range" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Verification range: $range"

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: gk-web/web/fusion-rpg-web/package-lock.json

      - name: Numeric-overflow guard (power-plan.md P0.6)
        shell: pwsh
        run: |
          python scripts/audit-overflow.py
          if ($LASTEXITCODE -ne 0) { throw "overflow audit found a critical finding — see output above" }

      - name: Magic-number guard (power-todo.md M.6)
        shell: pwsh
        run: |
          python scripts/audit-magic-numbers.py
          if ($LASTEXITCODE -ne 0) { throw "magic-number audit found an M1/M2 finding — see output above" }

      - name: resource-ownership drift guard (A-R1, spec-resource-ownership.md §5 test 3)
        shell: pwsh
        run: |
          # Regenerates the 166 resource.* aptitude edges from gk-core/data/tuning/resource-ownership.v1.json
          # in memory and diffs them against the shipped aptitudes.v{n}.json — catches a hand-edited
          # resource edge or a table drifted out of sync with the shipped file.
          python tools/tuning/resource_ownership.py --check
          if ($LASTEXITCODE -ne 0) { throw "resource_ownership.py --check found drift — see output above" }

      - name: species-generator staleness guard (seed-to-concrete T4.5/Checkpoint 4)
        shell: pwsh
        run: |
          # species-generator (creature-seed module 12) commits its generated tree
          # (gk-data/packs/fusion/data/generated/creatures/**) to the repo — --check regenerates every real classified
          # anchor and fails if any file on disk differs, catching a hand-edited generated file or a
          # tuning change nobody re-ran the generator for (spec-species-generator.md §7).
          dotnet run --project ../gk-forge/tools/CreatureSpeciesGen -- --check
          if ($LASTEXITCODE -ne 0) { throw "CreatureSpeciesGen --check found the generated tree stale — run 'dotnet run --project ../gk-forge/tools/CreatureSpeciesGen' and commit the result" }

      - name: family-expand staleness guard (E43, spec-family-expand.md §3.1/§5 test 2)
        shell: pwsh
        run: |
          # FamilyExpandGen commits its generated tree (gk-data/packs/fusion/data/seed/atoms/generated/**) to the repo,
          # same CreatureSpeciesGen --check pattern above — --check regenerates every atom row from the
          # 98 authored affix families + tier-bands.v1.json and fails if any generated file on disk
          # differs, or if a generated file's source family no longer exists.
          dotnet run --project ../gk-forge/tools/FamilyExpandGen -- --check
          if ($LASTEXITCODE -ne 0) { throw "FamilyExpandGen --check found the generated tree stale — run 'dotnet run --project ../gk-forge/tools/FamilyExpandGen' and commit the result" }

      - name: species-build plan staleness guard (T1.8, spec-redistribution-plan.md §"Commands")
        shell: pwsh
        run: |
          # redistribution-plan (species-build module 4) commits its generated plan
          # (gk-data/packs/fusion/data/generated/creatures/_species-build-plan.json) to the repo, same CreatureSpeciesGen
          # --check pattern above — --check replans the whole real corpus and fails if the committed
          # file differs, OR if the replanned corpus falls outside the shipped parity band (Phase 3's
          # own refusal, exit 1) — a near-miss never ships silently.
          dotnet run --project ../gk-forge/tools/CreatureBuildPlanGen -- --check
          if ($LASTEXITCODE -ne 0) { throw "CreatureBuildPlanGen --check found the plan stale or out of band — run 'dotnet run --project ../gk-forge/tools/CreatureBuildPlanGen' and commit the result" }

      - name: passive-tree catalog staleness guard (H9, spec-tree-binder.md §"Commands")
        shell: pwsh
        run: |
          # gk-forge/tools/TreeBinder commits its generated catalog (gk-data/packs/fusion/data/generated/passive-tree/**) to the
          # repo, same CreatureSpeciesGen/FamilyExpandGen --check pattern above — --check rebinds every
          # committed plan+seed pair and fails if any generated file on disk differs. Distinct from
          # `seedsmith trees plan --check` (the PLAN's own byte-identity check, Python side, not yet
          # wired into this workflow either) — this is the CATALOG half, C# side, one step lower in
          # the pipeline (tree-plan -> tree-language -> tree-binder).
          dotnet run --project ../gk-forge/tools/TreeBinder -- --check
          if ($LASTEXITCODE -ne 0) { throw "TreeBinder --check found the generated catalog stale — run 'dotnet run --project ../gk-forge/tools/TreeBinder -- --seed data/seed/passive-tree --out data/generated/passive-tree' and commit the result" }

      - name: Balance guard (class-system-todo.md P5.3 — termination HARD, dominance-mechanism HARD, dominance-verdict SOFT)
        shell: pwsh
        run: |
          # `--blame-hang-timeout 10min` (raised from 5min 2026-09-12): the slowest legitimate
          # single test measured here is ~107s (Data.Tests ActionUnlockGrantWiringTests; Core.Tests
          # also has a ~105s case), so 10min leaves ~5x headroom. It was briefly raised to cover a
          # 3 x 120s retry loop in two cold-process tests; that retry was removed 2026-09-12 (those
          # tests now launch a prebuilt apphost in ~0.7s), but the cap stays for the 107s cases.
          # Keep this aligned with the test.runsettings TestTimeout so local and CI behave the same.
          #
          # Deliberately its OWN step, not folded into "Restore / test (.NET)" below: that step runs
          # ten `dotnet test` calls in one script with no exit-code check between them, so only the
          # LAST one determines the step's pass/fail (confirmed against a real CI run, 2026-08-24 —
          # Core.Tests and Guard.Tests both failed and were silently swallowed because E2E.Tests, the
          # last call, also happened to fail that day) — a guard whose whole job is "fail the build"
          # cannot share that step. See docs/architecture/class-system/spec-balance-guard.md §2/§5.
          #
          # Filters to `Category=BalanceGuard` only, NOT the wider `Category=BalanceGuardBaseline` --
          # that second trait marks the one DominanceGuardTests case that asserts a fact about TODAY'S
          # TUNING DATA (no dominant corner), not the guard's own mechanism. spec-balance-guard.md §2 is
          # explicit a dominance verdict must never fail the build; blocking on it here would silently
          # reintroduce exactly that violation the day the data legitimately goes red (e.g. a deliberate
          # Phase 8 residual-fit trade-off). `Category=BalanceGuard` covers TerminationGuard's own tests
          # (HARD by design — a violation SHOULD fail CI) and DominanceGuard's MECHANISM tests only
          # (returns without throwing, coverage populated, no clock applied — code regressions, safe to
          # block on regardless of what the verdict itself says).
          # The seven `dotnet test` calls that named gk-forge and gk-fusion test projects were
          # removed here. They could never have run in this repository - gk-core has no
          # tests/FusionRpg.AtomImporter.Tests, no tools/LawnCombatObserver.Tests - so the
          # gate they sat in was reporting a coverage it did not have. Those projects are
          # wired where they live: gk-forge and gk-fusion each run their own solution from
          # their own CI, which is the thin entrypoint the workspace ownership rule asks for.
          dotnet test tests/FusionRpg.Core.Balance.Tests/FusionRpg.Core.Balance.Tests.csproj -c Release --verbosity minimal --blame-hang --blame-hang-timeout 10min --filter "Category=BalanceGuard"
          if ($LASTEXITCODE -ne 0) { throw "balance-guard: a termination invariant or dominance-guard-mechanism test failed — see output above" }

      - name: Restore / test (.NET)
        shell: pwsh
        run: |
          # Fixed 2026-09-01 (`seed-to-concrete` T0.8). This step used to run all ten `dotnet test`
          # calls with no exit-code check between them, so only the LAST call determined the step's
          # pass/fail — the exact defect the Balance-guard step's own comment above already documents
          # from a real CI run (2026-08-24: Core.Tests and Guard.Tests both failed and were silently
          # swallowed because E2E.Tests, the last call, also happened to fail that day). Every call
          # below now checks its own exit code and throws immediately, matching every other step in
          # this file — a failure in project #3 no longer waits to be masked by project #10.
          #
          # core-split-wiring E5 (TVB5.7): after the Core split each Core test project gets its own
          # line and exit check, in manifest order with the residual LAST. `WorkflowExitCheckTests`
          # holds the exit-check rule over every line; `CoreTestProjectPolicyTests` W5 fails the Guard
          # suite if a Core project on disk is missing from this file or from release.yml.
          dotnet test tests/FusionRpg.Core.AchievementTitlesTuningTests.Tests/FusionRpg.Core.AchievementTitlesTuningTests.Tests.csproj -c Release --verbosity minimal --blame-hang --blame-hang-timeout 10min
          if ($LASTEXITCODE -ne 0) { throw "FusionRpg.Core.AchievementTitlesTuningTests.Tests failed" }
          dotnet test tests/FusionRpg.Core.ActorHub.Tests/FusionRpg.Core.ActorHub.Tests.csproj -c Release --verbosity minimal --blame-hang --blame-hang-timeout 10min
          if ($LASTEXITCODE -ne 0) { throw "FusionRpg.Core.ActorHub.Tests failed" }
          dotnet test tests/FusionRpg.Core.ActorSurface.Tests/FusionRpg.Core.ActorSurface.Tests.csproj -c Release --verbosity minimal --blame-hang --blame-hang-timeout 10min
          if ($LASTEXITCODE -ne 0) { throw "FusionRpg.Core.ActorSurface.Tests failed" }
          dotnet test tests/FusionRpg.Core.Atoms.Tests/FusionRpg.Core.Atoms.Tests.csproj -c Release --verbosity minimal --blame-hang --blame-hang-timeout 10min
          if ($LASTEXITCODE -ne 0) { throw "FusionRpg.Core.Atoms.Tests failed" }
          dotnet test tests/FusionRpg.Core.Aura.Tests/FusionRpg.Core.Aura.Tests.csproj -c Release --verbosity minimal --blame-hang --blame-hang-timeout 10min
          if ($LASTEXITCODE -ne 0) { throw "FusionRpg.Core.Aura.Tests failed" }
          dotnet test tests/FusionRpg.Core.Balance.Tests/FusionRpg.Core.Balance.Tests.csproj -c Release --verbosity minimal --blame-hang --blame-hang-timeout 10min
          if ($LASTEXITCODE -ne 0) { throw "FusionRpg.Core.Balance.Tests failed" }
          dotnet test tests/FusionRpg.Core.BoardProjectionTests.Tests/FusionRpg.Core.BoardProjectionTests.Tests.csproj -c Release --verbosity minimal --blame-hang --blame-hang-timeout 10min
          if ($LASTEXITCODE -ne 0) { throw "FusionRpg.Core.BoardProjectionTests.Tests failed" }
          dotnet test tests/FusionRpg.Core.CapPolicyTests.Tests/FusionRpg.Core.CapPolicyTests.Tests.csproj -c Release --verbosity minimal --blame-hang --blame-hang-timeout 10min
          if ($LASTEXITCODE -ne 0) { throw "FusionRpg.Core.CapPolicyTests.Tests failed" }
          dotnet test tests/FusionRpg.Core.ClassSystem.Tests/FusionRpg.Core.ClassSystem.Tests.csproj -c Release --verbosity minimal --blame-hang --blame-hang-timeout 10min
          if ($LASTEXITCODE -ne 0) { throw "FusionRpg.Core.ClassSystem.Tests failed" }
          dotnet test tests/FusionRpg.Core.CombatCounterTests.Tests/FusionRpg.Core.CombatCounterTests.Tests.csproj -c Release --verbosity minimal --blame-hang --blame-hang-timeout 10min
          if ($LASTEXITCODE -ne 0) { throw "FusionRpg.Core.CombatCounterTests.Tests failed" }
          dotnet test tests/FusionRpg.Core.CombatDotTests.Tests/FusionRpg.Core.CombatDotTests.Tests.csproj -c Release --verbosity minimal --blame-hang --blame-hang-timeout 10min
          if ($LASTEXITCODE -ne 0) { throw "FusionRpg.Core.CombatDotTests.Tests failed" }
          dotnet test tests/FusionRpg.Core.CombatFanoutTests.Tests/FusionRpg.Core.CombatFanoutTests.Tests.csproj -c Release --verbosity minimal --blame-hang --blame-hang-timeout 10min
