      - name: Test-substrate leak alarm (disk-write-probe, T19b)
        shell: pwsh
        run: |
          # The static gate above (`guard-test-substrate.py`) only refuses a bad SOURCE pattern.
          # This wraps the Data suite (the one that accumulated 65.5 GB of temp dirs) so a run that
          # ACTUALLY leaves a `fusionrpg-*` temp dir or an `rpg-*.sqlite` under a test output root is
          # red too, even if the source pattern changed. Set-diff, never a count (`validation-ssot.md`):
          # a pre-existing dir is not read as a leak and an equal count cannot pass while membership
          # differs. `--no-build` reuses the Release build from the step above.
          python scripts/test_substrate_leak_alarm.py --run dotnet test tests/FusionRpg.Data.Tests/FusionRpg.Data.Tests.csproj -c Release --verbosity minimal --no-build
          if ($LASTEXITCODE -ne 0) { throw "test_substrate_leak_alarm.py failed — a test run left a temp dir or rpg-*.sqlite behind" }
          # ANCHOR(T28): profiles wiring appends after this step. Do not reorder the steps above.

      - name: Test profiles (T28 — CI is the `full` profile by construction)
        shell: pwsh
        run: |
          # T28 added no filtering here on purpose: every `dotnet test` call above runs UNFILTERED,
          # so CI already IS the `full` profile — the `DiskSemantics` (file-bound) and `Heavy` (>=20s)
          # tests run here, which is exactly the point (ephemeral cloud disk, correctness costs
          # nothing). `gk-core/scripts/test_fast.py` (`default`) is the LOCAL/agent loop only and is never
          # used in CI, so CI cannot accidentally inherit the dev filter. The leak alarm step above
          # also runs on `full` for the same reason.
          #
          # Guard (do not edit blindly): this assertion fails if someone later adds a --filter to a
          # `dotnet test` call in this workflow, which would silently drop disk/heavy coverage.
          $filters = Select-String -Path .github/workflows/ci.yml -Pattern 'dotnet test.*--filter' |
              Where-Object {
                  $_.Line.TrimStart().StartsWith('dotnet test') -and
                  $_.Line -notmatch '--filter\s+"Category=BalanceGuard"'
              }
          if ($filters) {
              $filters | ForEach-Object { Write-Host "$($_.LineNumber): $($_.Line.Trim())" }
              throw "CI test step gained a --filter — CI must stay the unfiltered full profile (only the BalanceGuard step is filtered)"
          }
          Write-Host "CI test calls are unfiltered = full profile (DiskSemantics + Heavy included)."

      # The session-boundary check does NOT run here, and this comment is the reason.
      #
      # It was invoked as `python .\scripts\session-boundary-check.py`, which resolves against THIS
      # repository's checkout. That file has never existed in gk-core - not tracked, not on disk, not
      # ignored - because the split left the 263 session records and their checker in the workflow
      # repository at the workspace root, whose origin is keepverse/gk-workflow. A CI runner has exactly
      # one checkout, so the step could only ever fail: python exits 2 on a missing file and the
      # `throw` below turned that into a red build.
      #
      # The enforcement registry row is NOT the bug and is deliberately left alone. It names
      # `scripts/session-boundary-check.py` with no repository qualifier, and `run_guards.py` resolves
      # that across all eight workspace roots - 23 guards live in gk-core, 4 in gk-fusion, and
      # `session-boundary` and `doc-citations` live here at the workspace root. The runner is right; only
      # the literal relative path in this workflow was wrong.
      #
      # The check is not lost. It runs in the repository that owns the records, in all three of its
      # workflows: ci.yml, nightly.yml and release.yml. Measured 2026-10-02: that repository's copy of
      # the registry had drifted - 3 records still `active` where this workspace's copy had them
      # `abandoned`, so `session-boundary-check --ci` exited 1 with DRIFT (111) - and those 3 have since
      # been converged, so all three of its workflows now exit 0.

      - name: Boundary guards (AGENTS.md — combat writes, Secondary-Unity boundary, Funnel deltas, DAL)
        shell: pwsh
        run: |
          # One call, one catalog (solid-enforcement `guard-runner`). run_guards.py reads
          # gk-core/scripts/enforcement-registry.v1.json and runs every ci/gating guard in its own child
          # process, printing a summary table before it fails. Wiring a guard is now a registry row,
          # not another hand-written line here — the mechanism that once left nine guards unwired.
          # The complete push range is supplied by the explicit range step above; no last-commit
          # fallback exists in the runner. The generated-seed registry row invokes its guard with that range and
          # --require-explicit-range.
          python .\scripts\run_guards.py --tier ci --ci-range $env:FUSIONRPG_VERIFICATION_RANGE
          if ($LASTEXITCODE -ne 0) { throw "run_guards.py --tier ci failed — a gating guard is red; see the summary table above" }

      - name: Verification-boundary integrity
        shell: pwsh
        run: |
          # This is intentionally its own step. Guard scripts use a non-zero exit to refuse, so putting
          # it after another guard in a shared block could make it unreachable; this script's exit code
          # directly gates the step.
          python .\scripts\guard-verification-boundaries.py

      - name: Content validation gate (E47)
        shell: pwsh
        run: |
          # Closes E24's B4 half (spec-validate-gate-ci.md) — AtomImporter --validate existed with
          # no CI caller, so ContentValidation.Lint/.Drift ran over the real shipped atom corpus in
          # nobody's pipeline. Runs against the REAL gk-data/packs/fusion/data/seed/ tree, never a fixture (§3.1) — a
          # gate over a fixture proves the gate works and nothing about the content.
          #
          # --db <scratch>: without it the tool resolves $FUSIONRPG_DATA, then walks up for
          # dist/FusionRpg.Server/data; a fresh CI checkout has neither, so the tool would exit 2
          # before reading a single seed file (Program.cs) — a gate that always exits 2 is a gate
          # nobody reads. --check: dry-run import (rolled back in one transaction) so the gate reads
          # the real corpus and writes nothing to a throwaway database.
          #
          # Finding policy (§3.2, decided 2026-09-03 — verified against ContentValidation's own
          # Blocking flags, not restated as new policy): a structural defect (unparseable file,
          # unknown kind, bad param, duplicate id) fails the import itself, upstream of --validate,
          # so it already fails this step with no gate logic needed. `drift` without a `powerNote`
          # is Blocking:true and fails. All seven lints (tier-gap, flat-tier, duplicate-affix,
          # backwards-interval, lonely-group, orphan, orphan-affix) and a noted `drift` are
          # Blocking:false by construction and only report. Budget checking stays out — no ceiling
          # data exists in the schema yet (rarity table has no budget column); A-G1 is what
          # introduces the first such data.
          dotnet run --project ../gk-forge/tools/AtomImporter -c Release -- --check --validate --db "$env:RUNNER_TEMP/atom-validate-db"
          if ($LASTEXITCODE -ne 0) { throw "content validation gate failed - see the lint / power drift lines above" }

      - name: Creature corpus dump is self-consistent (seed-to-concrete T1.2)
        shell: pwsh
        run: |
          # `--verify` is DB-free by design (spec-corpus-dump.md) — decisions.md rules out a real
          # game/Harmony in CI, so there is no populated hot.sqlite to regenerate the dump from
          # here. This re-hashes the committed payload files on disk and checks them against
          # _manifest.json's declared hash and counts — it catches a hand-edit or a bad merge, not
          # drift against the live game (that is the owner-run `--check` against a real database).
          dotnet run --project ../gk-forge/tools/CreatureCorpusDump -c Release -- --verify ../gk-data/packs/fusion/data/seed/creatures/_dump
          if ($LASTEXITCODE -ne 0) { throw "creature corpus dump under data/seed/creatures/_dump is not self-consistent with its own manifest — see output above" }

      - name: Validate item seed corpus
        shell: pwsh
        run: |
          dotnet run --project ../gk-forge/tools/ItemSeedValidator -c Release -- ../gk-data/packs/fusion/data/seed/items
          if ($LASTEXITCODE -ne 0) { throw "item seed corpus failed validation. The seed root is passed explicitly because the tool usage is `[seed root]`; left to its own walk it exits 2 with 'could not locate data/seed/items', which after the split is gk-data/packs/fusion/data/seed/items rather than <repo>/data/seed/items." }

      - name: Install seedsmith from the lockfile (reproducible env)
        shell: pwsh
        working-directory: gk-forge/tools/seedsmith
        run: |
          # G0.1 (spec-dependency-baseline.md): seedsmith declared ZERO dependencies until
          # 2026-09-01, so this job ran against whatever the runner happened to have. `jieba` was
          # imported by adapters/creatures/motifs.py and declared nowhere — a fresh clone failed
          # test_motif_derive.py with ModuleNotFoundError. Installing from the committed lockfile
          # makes the environment reproducible instead of ambient.
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { throw "pip upgrade failed" }
          python -m pip install -r requirements.lock
          if ($LASTEXITCODE -ne 0) { throw "seedsmith lockfile install failed" }
          python -m pip install -e . --no-deps
          if ($LASTEXITCODE -ne 0) { throw "seedsmith editable install failed" }

      - name: tools/tuning own tests (test-verification-boundary python-test-lane, R15)
        shell: pwsh
        working-directory: gk-core/tools/tuning
        run: |
          # pytest is installed by the seedsmith lockfile step above; this step must stay after it.
          python -m pytest . -q -p no:cacheprovider --continue-on-collection-errors
          if ($LASTEXITCODE -ne 0) { throw "tools/tuning's own test suite failed" }

      # The `tools-audit-tests` pytest project (registry root `.`, tests `gk-core/tests/tools`) owns
      # `gk-core/scripts/audit-program-pipeline.py` and `gk-core/scripts/fix-doc-citations.py` through the
      # `pipeline-audit-scripts` boundary. It landed with its tests but with no CI step, so
      # `CiPytestWiringTests.Every_pytest_project_has_a_ci_step_running_pytest_in_its_own_root` was red
      # (`pytest project root(s) with no 'python -m pytest' CI step at that working-directory: .`). The
      # step's `working-directory` must be exactly the project's `root` for that guard to count it.
      - name: tools audit scripts' own tests (pipeline-audit-scripts)
        shell: pwsh
        working-directory: gk-core
        run: |
          # Stdlib-only tests; pytest itself comes from the seedsmith lockfile step above.
          python -m pytest tests/tools -q -p no:cacheprovider --continue-on-collection-errors
          if ($LASTEXITCODE -ne 0) { throw "tools-audit-tests' own test suite failed" }

      - name: Fail-closed merge/acceptance regression
        shell: pwsh
        working-directory: gk-workflow/.claude/cmdc-agents/scripts
        run: |
          python -m pytest test_fail_closed_pipeline.py -q -p no:cacheprovider
          if ($LASTEXITCODE -ne 0) { throw "fail-closed merge/acceptance regression failed" }

      # ip-censor T1 (wiring half 1). The tool is new code, so its suite is green from the first
      # commit and needs no knownRed entry (spec-wiring.md §The lane depends on an unbuilt module).
      # This step tests the TOOL, not the corpus: a red ip-censor suite is a code defect, never an
      # IP finding. The advisory scan step (T11) and the release gate (T12) land separately, and
      # neither blocks CI on a finding (owner ruling IC-3).
      - name: tools/ip-censor own tests (ip-censor wiring, T1)
        shell: pwsh
        working-directory: gk-core/tools/ip-censor
        run: |
          python -m pip install -r requirements.lock
          if ($LASTEXITCODE -ne 0) { throw "ip-censor lockfile install failed" }
          python -m pip install -e . --no-deps
          if ($LASTEXITCODE -ne 0) { throw "ip-censor editable install failed" }
          python -m pytest tests -q -p no:cacheprovider --continue-on-collection-errors
          if ($LASTEXITCODE -ne 0) { throw "ip-censor's own test suite failed" }

      # ip-censor T11 (advisory CI scan, owner ruling IC-3). The scan is ADVISORY in CI: it exits 0
      # on findings and merely records them, so a non-zero exit here is a tool crash (a code defect),
      # never an IP finding — which is exactly why no `--fail-on` flag appears in this file. The
      # release gate (release.yml, T12) is the only place a finding blocks anything.
      # It runs from the REPOSITORY ROOT on purpose: `report` walks `git ls-files`, so a
      # `working-directory: gk-core/tools/ip-censor` would enumerate only the tool and the scan would pass
      # vacuously. The package is already installed by the step above; the plan is written to the
      # runner only and never committed (`tasks/ip-censor/**` is self-excluded from the scan).
      - name: IP advisory scan (ip-censor, IC-3)
        shell: pwsh
        run: |
          # The directory is created here because it does not exist in a fresh checkout: gk-core has
          # no `tasks/` tree at all, and nothing writes one. That made this step SILENT rather than red.
          # Measured 2026-10-02: a pwsh redirect to a path whose parent is missing raises
          # "Could not find a part of the path", does NOT run the command, and leaves $LASTEXITCODE at
          # 0 - so the `throw` below never fired, no artifact was produced, and the upload step's own
          # `if-no-files-found: warn` downgraded the missing file to a warning. CI went green having run
          # no IP scan at all, which is the one outcome worse than a red step.
          New-Item -ItemType Directory -Force -Path tasks/ip-censor | Out-Null
          python -m ipcensor.report scan --format json > tasks/ip-censor/ci-scan.json
          if ($LASTEXITCODE -ne 0) { throw "ip-censor's advisory scan crashed (a code defect, not an IP finding)" }
          if (-not (Test-Path tasks/ip-censor/ci-scan.json)) { throw "ip-censor's advisory scan wrote no artifact - the redirect failed, and $LASTEXITCODE does not report that" }
          $findings = (Get-Item tasks/ip-censor/ci-scan.json).Length
          if ($findings -lt 1000) { throw "ip-censor's advisory scan artifact is $findings bytes; a real report is ~900KB, so this is a truncated write rather than a clean scan" }

      - name: Upload the advisory IP scan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ip-censor-advisory-scan
          path: tasks/ip-censor/ci-scan.json
          if-no-files-found: warn

      - name: Item seed reachability (seedsmith)
        shell: pwsh
        run: |
          # Cutover complete (tasks/seedsmith-todo.md, S10, 2026-08-23): `seedsmith` replaces
          # `seed_graph` as the reachability gate. Parity was proven byte-identical across every
          # distinct state this corpus has ever had — not one snapshot but all four: the current
          # HEAD and three earlier commits reachable via `git log -- gk-data/packs/fusion/data/seed/items/`, spanning
          # the corpus's growth from 102 files to its current size, extracted read-only via
          # `git archive` and diffed with test_parity_seed_graph.py's own comparison. That is the
          # evidence step 2's planned one-week soak period existed to gather — real drift the
          # corpus had already produced, not a calendar wait for drift that might not occur.
          #
          # Only the seven Linkage/Registration metrics ported from `seed_graph` were promoted to
          # gates=True for this cutover (`seedsmith/metrics/linkage.py`) — a verified
          # byte-identical replacement for a check that already gated CI unconditionally, not a
          # new, uncalibrated metric. Every other metric in the suite (Coverage, Distribution,
          # Balance, Constraint, ExemplarConformance, SemanticDedup, Quality) still starts
          # measure-only, per spec-metrics.md §4's normal calibration discipline.
          python -m pytest tests -q --continue-on-collection-errors
          if ($LASTEXITCODE -ne 0) { throw "seedsmith's own test suite failed" }
          python -m seedsmith check --adapter items --gate ../../../gk-data/packs/fusion/data/seed/items
          if ($LASTEXITCODE -ne 0) { throw "item seed corpus has reachability gaps" }
        working-directory: gk-forge/tools/seedsmith

      - name: Creature anchor contract audits clean (seed-to-concrete T1.7 / Checkpoint 1)
        shell: pwsh
        run: |
          # Mechanical, per spec-anchor-contract.md §4: a numeric field anywhere in the resolved
          # species-anchor schema poisons every downstream classification row, so this gates CI
          # unconditionally rather than starting measure-only like a balance metric would.
          python -m seedsmith creatures contract --audit
          if ($LASTEXITCODE -ne 0) { throw "creature anchor contract has a numeric-smuggling finding — see output above" }
        working-directory: gk-forge/tools/seedsmith

      - name: Structure anchor contract audits clean (base-defense structure-schema, module 23)
        shell: pwsh
        run: |
          # Mechanical, per spec-structure-schema.md §4: the module's whole point is that this audit
          # fails the build rather than warning, so it gates CI unconditionally, the same way the
          # creature anchor contract step above does for its own schema.
          python -m seedsmith structures contract --audit
          if ($LASTEXITCODE -ne 0) { throw "structure anchor contract has a numeric-smuggling finding — see output above" }
        working-directory: gk-forge/tools/seedsmith

      - name: Creature corpus-coverage metrics (seed-to-concrete T1.10)
        shell: pwsh
        run: |
          # --creature-dump only (no --corpus): isolates the two creature-dump metrics from the item
          # corpus's own EmptyPartition/Balance/Distribution families, which need a real --corpus
          # to mean anything and would otherwise report noise here.
          python -m seedsmith report --gate --creature-dump ../../../gk-data/packs/fusion/data/seed/creatures/_dump
          if ($LASTEXITCODE -ne 0) { throw "creature corpus-coverage metrics found a gated finding — see output above" }
        working-directory: gk-forge/tools/seedsmith

      - name: Creature roster metrics gate (seed-to-concrete T2.10/T2.12/Checkpoint 2)
        shell: pwsh
        run: |
          # T2.12's own original note said this would "break CI with no anchor tree yet" — stale as
          # of 2026-09-06: the real anchor tree (gk-data/packs/fusion/data/seed/creatures/species/**, 504 tracked files,
          # 829-840 real classified species depending on which run) has been committed for a while
          # now, and this command needs no model call and no network access, only the committed
          # tree + gk-core/data/tuning/creature-roster-targets.v1.json. Verified directly before wiring it in,
          # not assumed: run against the real committed tree, exits 0 (14 real GAP findings, all
          # `gates=False` informational — none `gates=True`), so wiring it in cannot break the build
          # today. If a future roster change ever DOES trip an armed gate, that is this step doing
          # its job, not a regression in this step itself.
          python -m seedsmith creatures metrics --gate
          if ($LASTEXITCODE -ne 0) { throw "creature roster metrics found a gated finding — see output above" }
        working-directory: gk-forge/tools/seedsmith

      - name: Fusion-recipe seed staleness guard (creature-seed module 17/T8.3, spec-fusion-recipe-generator.md §3)
        shell: pwsh
        run: |
          # Same CreatureSpeciesGen/CreatureBuildPlanGen --check pattern above, for the one link in this
          # chain that did NOT have its own explicit gate until 2026-09-07: fusion-recipe-reconcile
          # commits gk-data/packs/fusion/data/generated/creatures/_fusion-recipes.json to the repo, and growing the species
          # corpus (a new anchor, a self-heal fallback resolving a field, a tuning change) can shift
          # which species are eligible fusion outputs/inputs without anyone touching this file by
          # hand. Found live the hard way: creature-corpus-self-heal Phase I's aptitudePrimary fallback
          # (11 species) silently desynced this exact committed seed (709->713 eligible outputs,
          # 695->699 deterministic recipes) until a full test run caught it by accident. `--check`
          # re-runs the real deterministic pass AND reuses (never re-derives) every already-resolved
          # gap-fill pick via its own per-deficit corpusContentHash freeze, so this never needs a
          # live model call to stay green — a real drift always has a one-line fix: re-run
          # `python -m seedsmith.adapters.creatures.fusion.reconcile` and commit the result.
          python -m seedsmith.adapters.creatures.fusion.reconcile --check
          if ($LASTEXITCODE -ne 0) { throw "fusion-recipe seed is stale — run 'python -m seedsmith.adapters.creatures.fusion.reconcile' (from gk-forge/tools/seedsmith) and commit the result" }
        working-directory: gk-forge/tools/seedsmith

      - name: Trophy id registry staleness guard (species-gear-chain T34, spec-species-materials.md § Design 4)
        shell: pwsh
        run: |
          # gk-data/packs/fusion/data/seed/items/materials/trophy-registry.json is generated: the deterministic trophyplan
          # module mints it from the species seed tree (skipping speciesKind: "excluded"),
          # gk-data/packs/fusion/data/seed/actions/_generated/family-map.json, and gk-core/data/tuning/species-material-run.v1.json
          # (perSpecies/perFamily). Same CreatureSpeciesGen/FamilyExpandGen --check pattern above:
          # --check replans in memory (no model call) and fails if the committed registry is missing
          # rows the current roster/tuning would mint — never on its own initiative removes a row,
          # because issued trophy ids are append-only (player inventory).
          python -m seedsmith.adapters.items.trophyplan.run --check
          if ($LASTEXITCODE -ne 0) { throw "trophy registry is stale — run 'python -m seedsmith.adapters.items.trophyplan.run --write' (from gk-forge/tools/seedsmith) and commit the result" }
        working-directory: gk-forge/tools/seedsmith

      - name: Creature preflight, CI mode (seed-to-concrete T1.8 — checks 1-4/7-9, no local model)
        shell: pwsh
        run: |
          # --skip-model is CI's own escape hatch (spec-dump-preflight.md's own Commands section)
          # and is never legal before a real generation run — run-control (module 9) refuses a
          # preflight record written with skipModel=true. This step only proves checks 1-4/7-9
          # stay green; it never authorizes a run.
          python -m seedsmith creatures preflight --skip-model
          if ($LASTEXITCODE -ne 0) { throw "creature preflight (checks 1-4, 7-9) failed — see output above" }
        working-directory: gk-forge/tools/seedsmith

      - name: Web unit tests
        working-directory: gk-web/web/fusion-rpg-web
        shell: pwsh
        run: |
          if (-not (Test-Path package-lock.json)) { throw "web package-lock.json is required; npm ci is the only supported install" }
          npm ci
          if ($LASTEXITCODE -ne 0) { throw "npm ci failed" }
          if (Test-Path package.json) {
            $pkg = Get-Content package.json -Raw | ConvertFrom-Json
            if ($pkg.scripts.test) { npm test; if ($LASTEXITCODE -ne 0) { throw "npm test failed" } }
            else { Write-Host "No npm test script; skipping web tests." }
          }

      - name: Web build
        working-directory: gk-web/web/fusion-rpg-web
        shell: pwsh
        run: |
          npm run build
          if ($LASTEXITCODE -ne 0) { throw "npm run build failed" }

      - name: Web bundle budget (GG-38 — Checkpoint G §19 check 13)
        working-directory: gk-web/web/fusion-rpg-web
        shell: pwsh
        run: |
          npm run check:bundle
          if ($LASTEXITCODE -ne 0) { throw "entry chunk is over budget, or Phaser/recharts leaked into it — see output above" }

      - name: Web i18n catalog is current (Checkpoint G — lingui extract clean)
        working-directory: gk-web/web/fusion-rpg-web
        shell: pwsh
        run: |
          npm run extract
          if ($LASTEXITCODE -ne 0) { throw "lingui extract failed" }
          $diff = git status --porcelain -- src/i18n/locales
          if ($diff) {
            Write-Host $diff
            throw "extracted i18n catalog is out of date — run 'npm run extract' in gk-web/web/fusion-rpg-web and commit the result"
          }

      - name: Web e2e tests (Checkpoint G §19 checks 3/7/11 — reachability, axe, viewport)
        working-directory: gk-web/web/fusion-rpg-web
        shell: pwsh
        run: |
          npx playwright install --with-deps chromium
          if ($LASTEXITCODE -ne 0) { throw "playwright browser install failed" }
          npm run test:e2e
          if ($LASTEXITCODE -ne 0) { throw "playwright e2e tests failed" }
