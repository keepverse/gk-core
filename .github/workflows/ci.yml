          dotnet test tests/FusionRpg.Core.DamageFxPaletteTests.Tests/FusionRpg.Core.DamageFxPaletteTests.Tests.csproj -c Release --verbosity minimal --blame-hang --blame-hang-timeout 10min
          if ($LASTEXITCODE -ne 0) { throw "FusionRpg.Core.DamageFxPaletteTests.Tests failed" }
          dotnet test tests/FusionRpg.Core.Diagnostics.Tests/FusionRpg.Core.Diagnostics.Tests.csproj -c Release --verbosity minimal --blame-hang --blame-hang-timeout 10min
