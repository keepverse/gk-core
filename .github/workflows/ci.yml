          dotnet test tests/FusionRpg.Core.CombatHitEmitPolicyTests.Tests/FusionRpg.Core.CombatHitEmitPolicyTests.Tests.csproj -c Release --verbosity minimal --blame-hang --blame-hang-timeout 10min
          if ($LASTEXITCODE -ne 0) { throw "FusionRpg.Core.CombatHitEmitPolicyTests.Tests failed" }
          dotnet test tests/FusionRpg.Core.Commanders.Tests/FusionRpg.Core.Commanders.Tests.csproj -c Release --verbosity minimal --blame-hang --blame-hang-timeout 10min
