name: Release

# gk-core's release gate. GENERATED FROM tests/core-test-projects.v1.json - the same committed
# registry that CoreTestProjectPolicyTests holds both this workflow and ci.yml to - and then hand-
# finished around it. The list is derived, not transcribed, because a transcribed list is a second
# copy of a fact that already has an owner, and this repository has spent the day removing exactly
# that: the pre-split monorepo's release gate was placed in gk-fusion by the split, where 70 of its
# 71 test paths named projects that repository does not contain, so it could not have passed since
# the migration. This file is where that gate belonged all along.
#
# CoreTestProjectPolicyTests.W5 requires every Core test project to be wired in BOTH ci.yml and
# release.yml, and it is the check that would have caught the misplacement while it was still a
# document rather than a shipped green gate.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # A release is a declared CI superset, not a second hand-maintained partial test list: this
  # reusable call executes every gate in ci.yml at the tag's exact checked-out commit.
  ci-superset:
    name: CI superset
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  publish:
    needs: ci-superset
    runs-on: windows-latest
    # A real .NET process-redirection deadlock can hang a dotnet test call with no diagnostic, so the
    # job is bounded rather than left to the runner's own 6-hour default.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          # Release and the reusable CI job inspect the complete tag range, not a shallow tip.
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            6.0.x

      - name: Unit tests (pre-publish)
        shell: pwsh
        run: |
          # Each call checks its OWN exit code. Before 2026-09-19 several `dotnet test` lines ran with
          # no check between them, so only the last one decided the step and an earlier failure
          # still published the release. `--blame-hang-timeout` matches test.runsettings'
          # TestTimeout, which is the value the release gate and ci.yml must agree on.
          #
          # BalanceGuard trait filters stay in ci.yml only; this gate runs each project unfiltered,
          # because a release that skips the tests it filters out in CI is not a superset.
            dotnet test tests/FusionRpg.Core.AchievementTitlesTuningTests.Tests/FusionRpg.Core.AchievementTitlesTuningTests.Tests.csproj -c Release --verbosity minimal --blame-hang --blame-hang-timeout 10min
            if ($LASTEXITCODE -ne 0) { throw "FusionRpg.Core.AchievementTitlesTuningTests.Tests failed" }
            dotnet test tests/FusionRpg.Core.ActorHub.Tests/FusionRpg.Core.ActorHub.Tests.csproj -c Release --verbosity minimal --blame-hang --blame-hang-timeout 10min
            if ($LASTEXITCODE -ne 0) { throw "FusionRpg.Core.ActorHub.Tests failed" }
            dotnet test tests/FusionRpg.Core.ActorSurface.Tests/FusionRpg.Core.ActorSurface.Tests.csproj -c Release --verbosity minimal --blame-hang --blame-hang-timeout 10min
            if ($LASTEXITCODE -ne 0) { throw "FusionRpg.Core.ActorSurface.Tests failed" }
            dotnet test tests/FusionRpg.Core.Atoms.Tests/FusionRpg.Core.Atoms.Tests.csproj -c Release --verbosity minimal --blame-hang --blame-hang-timeout 10min
            if ($LASTEXITCODE -ne 0) { throw "FusionRpg.Core.Atoms.Tests failed" }
            dotnet test tests/FusionRpg.Core.Aura.Tests/FusionRpg.Core.Aura.Tests.csproj -c Release --verbosity minimal --blame-hang --blame-hang-timeout 10min
            if ($LASTEXITCODE -ne 0) { throw "FusionRpg.Core.Aura.Tests failed" }
            dotnet test tests/FusionRpg.Core.Balance.Tests/FusionRpg.Core.Balance.Tests.csproj -c Release --verbosity minimal --blame-hang --blame-hang-timeout 10min
            if ($LASTEXITCODE -ne 0) { throw "FusionRpg.Core.Balance.Tests failed" }
            dotnet test tests/FusionRpg.Core.BoardProjectionTests.Tests/FusionRpg.Core.BoardProjectionTests.Tests.csproj -c Release --verbosity minimal --blame-hang --blame-hang-timeout 10min
